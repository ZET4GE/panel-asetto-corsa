{{/* gotype: github.com/JustaPenguin/assetto-server-manager.combineResultsTemplateVars */}}

{{ define "title" }}Combinar Resultados{{ end }}

{{ define "content" }}
    <div class="zg-page-head">
        <a class="zg-page-eyebrow d-inline-block" href="/results"><i class="fas fa-caret-left mr-1"></i> Volver a resultados</a>
        <h1 class="zg-page-title">Combinar</h1>
        <p class="zg-page-lead">Elegí dos o más sesiones para unirlas en un solo archivo de resultados.</p>
        <div class="zg-page-rule"></div>
    </div>

    <form method="post" action="/results/combine">

        <select multiple required class="form-control" name="CombineResults" size="15">
            {{ range $i, $result := .Results }}
                <option value="{{ $result.SessionFile }}">{{ prettify $result.Type.String false }} en {{ prettify $result.TrackName false }} {{ with $result.TrackConfig }} - {{ prettify . true }} {{ end }} ({{ $result.GetDate }})</option>
            {{ end }}
        </select>

        <button class="btn btn-primary float-right mt-3" type="submit"><i class="fas fa-layer-group mr-1"></i> Combinar Resultados Seleccionados</button>

    </form>

    <div class="clearfix"></div>
{{ end }}
