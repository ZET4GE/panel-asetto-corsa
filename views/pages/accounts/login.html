{{ define "title" }}Iniciar Sesión{{ end }}

{{ define "content" }}
    <div class="col-lg-6 offset-lg-3">
        <div class="zg-page-head text-center">
            <div class="zg-page-eyebrow"><span class="zg-brand-flag mr-2" aria-hidden="true"></span>Zonegan Racing</div>
            <h1 class="zg-page-title">Iniciar Sesión</h1>
            <div class="zg-page-rule"></div>
        </div>

        <form method="post" action="/login">
            <div class="card mb-3">
                <div class="card-body">
                    <div class="form-group">
                        <label for="Username">Usuario</label>
                        <input
                                type="text"
                                id="Username"
                                name="Username"
                                class="form-control"
                                placeholder="usuario"
                        >
                    </div>
                    <div class="form-group">
                        <label for="Password">Contraseña</label>
                        <input
                                type="password"
                                id="Password"
                                name="Password"
                                class="form-control"
                                placeholder="contraseña"
                        >
                    </div>

                    <button class="btn btn-primary btn-block mt-4" type="submit">Iniciar Sesión</button>
                </div>
            </div>
        </form>
    </div>
{{ end }}
